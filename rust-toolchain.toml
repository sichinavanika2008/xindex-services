[toolchain]
# Pinned and declared as the workspace MSRV for audit reproducibility. CI
# mirrors this exact version in .github/workflows/{ci,assurance}.yml and runs
# scripts/check-msrv.sh against the complete locked all-feature workspace.
# (the cargo-careful job overrides to nightly — it needs -Z to build its
# instrumented sysroot). The lockfile's dependency floor is at least 1.90, but
# 1.95.0 is the lowest whole-workspace compiler reproduced for this snapshot.
# Bump the manifest, this file, and the workflows together.
channel = "1.95.0"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
profile = "minimal"
