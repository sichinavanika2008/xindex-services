[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xindex/xindex-services"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "io-util", "net"] }
# Ethereum: alloy ecosystem
alloy = { version = "0.8", features = ["full", "node-bindings"] }
alloy-sol-types = "0.8"
alloy-primitives = "0.8"
# HTTP client (rustls, no system openssl)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors
thiserror = "1"
anyhow = "1"
# Tracing / logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# DB (placeholder — first user is M2). `default-features = false` drops
# sqlx-mysql / sqlx-postgres / `any` driver bundle we don't use, which
# also removes the transitive `rsa` crate (RUSTSEC-2023-0071: Marvin
# timing-sidechannel; no fixed upgrade upstream) and the unmaintained
# `derivative` (RUSTSEC-2024-0388).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
# CLI + tests
clap = { version = "4", features = ["derive", "env"] }
rstest = "0.23"
wiremock = "0.6"
# Async stream helpers
futures-util = "0.3"
# Observability (crates/ops) — Prometheus exporter + minimal HTTP server
# for the /metrics endpoint. OTLP/OpenTelemetry deferred to v2 once we
# have a real Grafana stack to point at — JSON logs + Prometheus pull
# is sufficient infrastructure for v1.
prometheus = { version = "0.13", default-features = false }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
# Bitcoin stack (chain-btc + multisig + executor)
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery", "rand-std"] }
miniscript = { version = "12", default-features = false, features = ["std"] }
bdk_esplora = { version = "0.20", default-features = false, features = ["blocking", "std"] }
bdk_wallet = { version = "1", default-features = false, features = ["std"] }
# Per-chain address codecs (Phase 3.1 U6):
# - bech32: LTC hand-rolled bech32 with "ltc" HRP. Already transitive
#   via bitcoin; promoted to an explicit dep so chain-utxo can use it
#   without the bitcoin re-export.
# - bitcoincash-addr: BCH CashAddr (`bitcoincash:`-prefixed base32).
#   Pinned to the v0.5 lineage per plan §"Architecture". Pure-Rust,
#   MIT-licensed, no native deps.
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
bitcoincash-addr = "0.5"
# Cosmos stack (cosmos-tx, Phase 3.3). Hand-rolled — no cosmrs/prost. The
# pure crate needs SHA-256 for the amino StdSignDoc sign-bytes and the
# LegacyAminoPubKey multisig-address derivation; secp256k1 (verify +
# low-S) reuses k256 as the safe-evm crate does.
sha2 = "0.10"
# XRP stack (xrp-tx, Phase 4.4). Hand-rolled STObject codec — no
# xrpl-rust/bs58. XRPL AccountIDs are RIPEMD160(SHA256(pubkey)); the
# signing digest is SHA512Half (SHA-512 then first 32 bytes). digest 0.10
# matches sha2 0.10. secp256k1 (DER + low-S) reuses k256.
ripemd = "0.1"
# Solana stack (solana-tx, Phase 4.5). Hand-rolled legacy message + Squads
# V4 instruction codec — no solana-sdk/anchor (the heaviest dep tree in the
# ecosystem; conflicts with the deny-heavy, no-openssl posture). Pure-Rust
# crates only: ed25519 signing (ed25519-dalek), the ed25519 on-curve check
# for PDA derivation (curve25519-dalek ≥ 4.1.3 — RUSTSEC-2024-0344 fixed),
# and base58 (bs58). SHA-256 (PDA preimage + Anchor discriminators) reuses
# the sha2 0.10 already pinned above.
ed25519-dalek = "2"
curve25519-dalek = "4"
bs58 = "0.5"
# TRON stack (tron-tx, Phase 4.6). Hand-rolled protobuf-3 `raw_data` codec
# + TRON address codec + secp256k1 recoverable signing — no TRON SDK / no
# prost (the byte surface is narrow and gated on a tronweb byte-match). The
# txID is sha256(raw_data) (sha2, above); the address derivation uses
# keccak256 (reused from alloy-primitives, already in-tree — no tiny-keccak);
# base58check uses bs58 (above); recoverable sign/recover reuses k256.
# base64: Solana JSON-RPC returns account data base64-encoded (base58 only
# covers data < 129 bytes; the Squads Multisig account is larger). Pure-Rust.
base64 = "0.22"
# Turnkey custody wire (turnkey-client, DL-CUSTODY-TURNKEY-1). Turnkey API
# requests are P-256 (NIST secp256r1) request stamps — a sibling of the
# RustCrypto k256 (secp256k1) the workspace already uses, pure-Rust and
# ring/openssl-free, so it adds no new crypto backend and keeps cargo
# deny/audit clean. `ecdsa` gives the DER-encoded SHA-256 ECDSA stamp.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# Inter-crate
xindex-shared = { path = "crates/shared" }
xindex-custody-core = { path = "crates/custody-core" }
xindex-turnkey-client = { path = "crates/turnkey-client" }
xindex-cosmos-tx = { path = "crates/cosmos-tx" }
xindex-xrp-tx = { path = "crates/xrp-tx" }
xindex-solana-tx = { path = "crates/solana-tx" }
xindex-tron-tx = { path = "crates/tron-tx" }
xindex-chain-eth = { path = "crates/chain-eth" }
xindex-chain-evm = { path = "crates/chain-evm" }
xindex-chain-cosmos = { path = "crates/chain-cosmos" }
xindex-chain-xrp = { path = "crates/chain-xrp" }
xindex-chain-solana = { path = "crates/chain-solana" }
xindex-chain-tron = { path = "crates/chain-tron" }
xindex-chain-thor = { path = "crates/chain-thor" }
xindex-chain-utxo = { path = "crates/chain-utxo" }
xindex-multisig = { path = "crates/multisig" }
xindex-safe-evm = { path = "crates/safe-evm" }
xindex-signer = { path = "crates/signer" }
xindex-executor = { path = "crates/executor" }
xindex-relayer = { path = "crates/relayer" }
xindex-ops = { path = "crates/ops" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
