name: Assurance

# Deep, slow assurance (UB checks, mutation testing). Scheduled + manual, plus
# a self-test on edits to this file — workflow_dispatch can't reach it while the
# repo's default branch (main) lacks this workflow, so the push trigger is the
# only way to exercise it from a feature branch. Runs on GitHub's runners
# rather than a local box that thrashes on full-workspace builds.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/assurance.yml

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XINDEX_ASSURANCE_SOURCE: xindex-assurance-source
  XINDEX_ASSURANCE_MANIFEST: xindex-assurance-source/config/assurance-tools.json
  XINDEX_ASSURANCE_MANIFEST_SHA256: dc96ed7ac52e7e5a1103b3bc35ca9d7b64107927f3f02c4b50c25893aaa07619
  XINDEX_ASSURANCE_SCRIPT_SHA256: 27bd1701dd8f6db53a9ff181c32dd590fdcc8dcafb30e672c8a78cd1bde92589

jobs:
  careful:
    name: cargo-careful (UB + stdlib debug asserts)
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins the workspace to a stable release. That pin
    # otherwise wins over the nightly default installed below (toml beats the
    # rustup default in override precedence), so cargo-careful fed its sysroot
    # build a stable rustc and the -Z flags errored. RUSTUP_TOOLCHAIN beats the
    # toml file, forcing nightly for both the install and the run here.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out canonical assurance tool policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/Xindex
          ref: feat/index-methodology
          path: xindex-assurance-source
          persist-credentials: false
          sparse-checkout: |
            config/assurance-tools.json
            scripts/assurance_tools.py
          sparse-checkout-cone-mode: false

      - name: Verify canonical assurance policy content
        run: |
          printf '%s  %s\n' "$XINDEX_ASSURANCE_MANIFEST_SHA256" "$XINDEX_ASSURANCE_MANIFEST" | sha256sum --check --strict
          printf '%s  %s\n' "$XINDEX_ASSURANCE_SCRIPT_SHA256" "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" | sha256sum --check --strict

      - name: Load reviewed assurance tool pins
        id: assurance_tools
        run: python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" export-github >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.assurance_tools.outputs.rust_nightly }}
          components: rust-src

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-careful
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.assurance_tools.outputs.rust_nightly }}
        run: cargo install --locked --version "=${{ steps.assurance_tools.outputs.cargo_careful }}" cargo-careful

      - name: Verify assurance tool versions
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.assurance_tools.outputs.rust_nightly }}
        run: |
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" verify --tool rust_nightly
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" verify --tool cargo_careful

      - name: careful test
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.assurance_tools.outputs.rust_nightly }}
        run: cargo careful test --workspace

  mutants:
    name: cargo-mutants (security-critical crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out canonical assurance tool policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/Xindex
          ref: feat/index-methodology
          path: xindex-assurance-source
          persist-credentials: false
          sparse-checkout: |
            config/assurance-tools.json
            scripts/assurance_tools.py
          sparse-checkout-cone-mode: false

      - name: Verify canonical assurance policy content
        run: |
          printf '%s  %s\n' "$XINDEX_ASSURANCE_MANIFEST_SHA256" "$XINDEX_ASSURANCE_MANIFEST" | sha256sum --check --strict
          printf '%s  %s\n' "$XINDEX_ASSURANCE_SCRIPT_SHA256" "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" | sha256sum --check --strict

      - name: Load reviewed assurance tool pins
        id: assurance_tools
        run: python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" export-github >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.assurance_tools.outputs.rust_stable }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-mutants
        run: cargo install --locked --version "=${{ steps.assurance_tools.outputs.cargo_mutants }}" cargo-mutants

      - name: Verify assurance tool versions
        run: |
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" verify --tool rust_stable
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" verify --tool cargo_mutants

      # Scoped to the crypto + CTD-1 core (eip712/RIC and the daemon's
      # intent/psbt gate). Drop the -p flags to run the whole workspace.
      # Informational: a surviving mutant is a test-coverage signal, not a
      # regression, and a from-scratch run is multi-hour. Universal-noise
      # classes (Debug impls, wall-clock helpers) are excluded in mutants.toml;
      # the security-relevant survivors are triaged in docs/ASSURANCE.md.
      # continue-on-error keeps the workflow green while the survivor list is
      # still being driven down — the MISSED mutants surface as run annotations.
      - name: cargo mutants
        continue-on-error: true
        run: cargo mutants --baseline=skip -p xindex-shared -p xindex-signer-daemon
