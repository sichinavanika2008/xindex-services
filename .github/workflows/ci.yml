name: CI

# Fast gate: runs on every push and PR (was previously `branches: [main]`,
# which never fired because there is no `main` branch — CI was dormant).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XINDEX_ASSURANCE_SOURCE: xindex-assurance-source
  XINDEX_ASSURANCE_MANIFEST: xindex-assurance-source/config/assurance-tools.json
  XINDEX_ASSURANCE_MANIFEST_SHA256: dc96ed7ac52e7e5a1103b3bc35ca9d7b64107927f3f02c4b50c25893aaa07619
  XINDEX_ASSURANCE_SCRIPT_SHA256: 27bd1701dd8f6db53a9ff181c32dd590fdcc8dcafb30e672c8a78cd1bde92589

jobs:
  msrv:
    name: declared MSRV (locked all-feature check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.95.0" # keep in sync with Cargo.toml + rust-toolchain.toml

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: manifest/toolchain/compiler equality + workspace check
        run: ./scripts/check-msrv.sh

  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    env:
      # Deny plain rustc warnings here (clippy lints are denied via the
      # command + workspace lints). Scoped to this job so it can't break the
      # `cargo install` in the supply-chain job.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.95.0" # keep in sync with Cargo.toml + rust-toolchain.toml
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: ABI manifest
        run: ./scripts/check-abi.sh

      - name: compiled production profile behavior + supplemental lints
        run: ./scripts/check-production-profile.sh

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        # No --all-features: matches the authoritative `just gate` (clippy
        # above keeps --all-features for static coverage). Enabling every
        # feature at once is not a supported runtime combination and breaks
        # the swap-back multisig finalize.
        run: cargo test --workspace

  supply-chain:
    name: deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check out canonical assurance tool policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/Xindex
          ref: feat/index-methodology
          path: xindex-assurance-source
          persist-credentials: false
          sparse-checkout: |
            config/assurance-tools.json
            scripts/assurance_tools.py
          sparse-checkout-cone-mode: false

      - name: Verify canonical assurance policy content
        run: |
          printf '%s  %s\n' "$XINDEX_ASSURANCE_MANIFEST_SHA256" "$XINDEX_ASSURANCE_MANIFEST" | sha256sum --check --strict
          printf '%s  %s\n' "$XINDEX_ASSURANCE_SCRIPT_SHA256" "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" | sha256sum --check --strict

      - name: Load and check reviewed assurance tool pins
        id: assurance_tools
        run: |
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" export-github >> "$GITHUB_OUTPUT"
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" check --profile services --repo .

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.assurance_tools.outputs.rust_stable }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Pre-fetch the advisory DB via actions/checkout (system git + token).
      # cargo-audit's own libgit2 clone fails on runners ("failed to prepare
      # clone"); a checkout into the default db path lets `audit -n` run
      # offline. Latest DB HEAD is intended — we want current advisories.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: rustsec/advisory-db
          ref: main
          path: advisory-db
          persist-credentials: false

      # Run the tools directly (matches `just gate`'s authoritative ignore)
      # rather than third-party actions, keeping the action surface minimal.
      - name: install cargo-deny + cargo-audit
        run: |
          cargo install --locked --version "=${{ steps.assurance_tools.outputs.cargo_deny }}" cargo-deny
          cargo install --locked --version "=${{ steps.assurance_tools.outputs.cargo_audit }}" cargo-audit

      - name: verify supply-chain tool versions
        run: |
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" verify --tool cargo_deny
          python3 "$XINDEX_ASSURANCE_SOURCE/scripts/assurance_tools.py" verify --tool cargo_audit

      - name: cargo deny
        run: cargo deny check

      # `cargo audit` is the authoritative advisory gate (full Cargo.lock scan;
      # cargo-deny's feature-resolved graph is NOT a superset — see deny.toml).
      # -n/--no-fetch uses the pre-fetched DB above.
      - name: cargo audit
        run: cargo audit --no-fetch --db advisory-db --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0185
