name: CI

# Fast gate: runs on every push and PR (was previously `branches: [main]`,
# which never fired because there is no `main` branch — CI was dormant).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    env:
      # Deny plain rustc warnings here (clippy lints are denied via the
      # command + workspace lints). Scoped to this job so it can't break the
      # `cargo install` in the supply-chain job.
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        # No --all-features: matches the authoritative `just gate` (clippy
        # above keeps --all-features for static coverage). Enabling every
        # feature at once is not a supported runtime combination and breaks
        # the swap-back multisig finalize.
        run: cargo test --workspace

  supply-chain:
    name: deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Run the tools directly (matches `just gate`'s authoritative ignore)
      # rather than third-party actions, keeping the action surface minimal.
      - name: install cargo-deny + cargo-audit
        run: cargo install cargo-deny cargo-audit --locked

      - name: cargo deny
        run: cargo deny check

      # Retry: the advisory-db git clone is occasionally flaky on runners
      # ("failed to prepare clone"). Three attempts before failing for real.
      - name: cargo audit
        run: |
          for attempt in 1 2 3; do
            if cargo audit --ignore RUSTSEC-2023-0071; then
              exit 0
            fi
            echo "cargo audit attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "cargo audit failed after 3 attempts" >&2
          exit 1
