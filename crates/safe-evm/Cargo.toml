[package]
name = "xindex-safe-evm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true, features = ["serde", "k256"] }
alloy-sol-types.workspace = true
# `arithmetic` adds `Signature::normalize_s` — the EIP-2 low-S assertion in
# `sigs::recover_signer` (a Safe `checkSignatures` rejects high-S).
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
serde.workspace = true
thiserror.workspace = true
xindex-shared.workspace = true

[dev-dependencies]
serde_json.workspace = true
