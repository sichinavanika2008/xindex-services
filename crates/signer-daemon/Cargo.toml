reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Bitcoin PSBT signing path (DL-M5-3 `psbt-input` endpoint).
bitcoin.workspace = true
base64 = "0.22"

[dev-dependencies]
wiremock.workspace = true
tower = "0.5"
# End-to-end loopback integration: spin up the real daemon + drive it
