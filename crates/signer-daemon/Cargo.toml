[package]
name = "xindex-signer-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xindex-shared.workspace = true
xindex-multisig.workspace = true
# V5: Safe v1.4.1 EIP-712 digest recompute path. The daemon never
# blind-signs a coordinator-supplied hash — it rebuilds from the ABI
# inputs and rejects mismatches.
xindex-safe-evm.workspace = true
# C5 (Phase 3.3): Cosmos amino sign-bytes recompute + secp256k1 verify +
# low-S normalization. Same never-blind-sign discipline as safe-evm.
xindex-cosmos-tx.workspace = true
# C5 (Phase 4.4): XRP STObject body recompute + per-signer SMT-blob digest
# + DER low-S verify. Same never-blind-sign discipline.
xindex-xrp-tx.workspace = true
# S6 (Phase 4.5): Solana ed25519 — re-derives Squads PDAs + rebuilds the
# message for the never-blind-sign validation. Same discipline.
xindex-solana-tx.workspace = true
# Phase 4.6: TRON — rebuilds the raw_data protobuf + recomputes the txID
# for the never-blind-sign validation; recovers the signer to verify the
# HSM signature. Same discipline.
xindex-tron-tx.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
# 1.13: EIP-2 low-S normalization of the HSM EVM-Safe signature (Safe
# `checkSignatures` rejects high-S). k256 is the workspace secp256k1 crate
# (already used by xrp-tx / tron-tx / cosmos-tx); reused here directly.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
async-trait = "0.1"
sqlx.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
# HTTP server + client (axum for the daemon endpoints; reqwest for the
# outbound call to the locally-fronting Web3Signer instance).
axum = { workspace = true, features = ["json"] }
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# Bitcoin PSBT signing path (DL-M5-3 `psbt-input` endpoint).
bitcoin.workspace = true
base64 = "0.22"
# mTLS (DL-M5-5, closes M-R3): pinned-coordinator-cert client auth wrapping
# the router on the production bind. rustls + tokio-rustls are pinned to the
# workspace `ring` provider (NOT the aws-lc-rs default) so no second crypto
# backend is pulled. hyper-util serves the axum router over the TLS stream
# (the axum low-level-rustls pattern).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# PEM loading via rustls-pki-types' always-on `pem` module (the crate rustls
# already re-exports as `rustls::pki_types`) — NOT the separate `rustls-pemfile`
# crate, which is unmaintained (RUSTSEC-2025-0134). pki-types is already in the
# tree, so this pulls no new crate and removes the advisory; `std` (⇒ alloc) is
# all the pem `PemObject` API needs.
rustls-pki-types = { version = "1", features = ["std"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

[dev-dependencies]
wiremock.workspace = true
tower = "0.5"
# Self-signed certs for the mTLS handshake test (dev only); pinned to `ring`.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# k256 (the cosmos/xrp/tron HSM-stub tests + 1.13 low-S) is a non-dev
# dependency above.
# End-to-end loopback integration: spin up the real daemon + drive it
# from the production coordinator clients (`RemoteHsmBackend`,
# `RemoteMultisigCosigner`).
xindex-signer.workspace = true
xindex-executor.workspace = true
# V9 e2e: drives `EvmRedeemExecutor` (V7) against three real
# `signer-daemon` instances over HTTP. Requires the EVM chain trait
# (V4) + the production cosigner cosigner trait shape (V7).
xindex-chain-evm.workspace = true
alloy = { workspace = true }
# C9 e2e: drives `CosmosRedeemExecutor` (C7) against three real daemons.
# Needs the Cosmos chain trait (C4) for the stub client + the multisig
# descriptor (C3) to derive the account address.
xindex-chain-cosmos.workspace = true
xindex-cosmos-tx.workspace = true
# C9 e2e (Phase 4.4): drives `XrpRedeemExecutor` (C7) against three real
# daemons. Needs the XRP chain trait (C4) for the stub client; xrp-tx (C3)
# is already a non-dev dep for the handler.
xindex-chain-xrp.workspace = true
# S7 e2e (Phase 4.5): drives `SolanaRedeemExecutor` (S5) through the real
# `validate_and_sign` (S6). Needs the Solana chain trait (S4) for the stub
# client; solana-tx (S2/S3) is already a non-dev dep for the handler.
xindex-chain-solana.workspace = true
# Phase 4.6 e2e: drives `TronRedeemExecutor` against three real daemons.
# Needs the TRON chain trait for the stub client; tron-tx is already a
# non-dev dep for the handler.
xindex-chain-tron.workspace = true
