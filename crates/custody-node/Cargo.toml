[package]
name = "xindex-custody-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "xindex-turnkey-approver"
path = "src/bin/xindex-turnkey-approver.rs"

[dependencies]
xindex-custody-core.workspace = true
xindex-shared.workspace = true
xindex-turnkey-client.workspace = true
# TK-01: the approver independently reconstructs each family's unsigned tx from
# the prepared fields (using the SAME builders the executor signs with) and
# recomputes the signing payload to assert it equals the signing request.
xindex-cosmos-tx.workspace = true
xindex-xrp-tx.workspace = true
xindex-tron-tx.workspace = true
xindex-solana-tx.workspace = true
alloy-primitives.workspace = true
bitcoin.workspace = true
tokio.workspace = true
# Approver-watcher binary (xindex-turnkey-approver): CLI + config + logging.
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Sign test RIC/ACC digests with a secp256k1 key (same pattern as the
# `xindex_shared::intent` verifier tests). Test-only.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
# Encode `depositWithExpiry` calldata in the EVM decision-core tests.
alloy-sol-types.workspace = true
