[package]
name = "xindex-chain-eth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xindex-shared.workspace = true
xindex-signer = { path = "../signer" }
xindex-chain-utxo.workspace = true
xindex-chain-thor.workspace = true
alloy = { workspace = true }
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
bitcoin.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures-util.workspace = true
serde_json.workspace = true
serde.workspace = true
# Blocking JSON-RPC for the sync `Erc20ArrivalClient` (mirrors how
# chain-btc's Esplora backs the sync `BitcoinChainClient`).
reqwest = { workspace = true, features = ["blocking"] }
# CTD-1 Slice B: the per-operator observer service (xindex-observe-redeem)
# exposes /api/v1/certify-ric over HTTP — same axum surface the
# signer-daemon uses.
axum = { workspace = true, features = ["json"] }
sqlx.workspace = true
xindex-ops.workspace = true
prometheus.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

[dev-dependencies]
wiremock.workspace = true

[[bin]]
name = "xindex-watch"
path = "src/bin/xindex-watch.rs"

[[bin]]
name = "xindex-observe-redeem"
path = "src/bin/xindex-observe-redeem.rs"

[[bin]]
name = "xindex-finalized-observer"
path = "src/bin/xindex-finalized-observer.rs"

[[bin]]
name = "xindex-attest"
path = "src/bin/xindex-attest.rs"

[[bin]]
name = "xindex-attest-redeem"
path = "src/bin/xindex-attest-redeem.rs"

[[bin]]
name = "xindex-halt-watchdog"
path = "src/bin/xindex-halt-watchdog.rs"
