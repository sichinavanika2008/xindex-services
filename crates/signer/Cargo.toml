[package]
name = "xindex-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xindex-shared.workspace = true
xindex-chain-thor.workspace = true
xindex-chain-utxo.workspace = true
# V6: EVM cross-check policies use `EvmChainClient` for log scanning
# (THORChain Router `TransferOut` events) and tip queries.
xindex-chain-evm.workspace = true
# C6: Cosmos cross-check policies use `CosmosChainClient` for native
# bank-transfer observation (refund: uatom back to our multisig).
xindex-chain-cosmos.workspace = true
# C6 (Phase 4.4): XRP cross-check policies use `XrpChainClient` for native
# Payment observation (refund: XRP back to our multisig, delivered_amount).
xindex-chain-xrp.workspace = true
xindex-ops.workspace = true
alloy = { workspace = true }
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
async-trait = "0.1"
bitcoin.workspace = true
thiserror.workspace = true
tracing.workspace = true
# RemoteHsmBackend talks HTTP to the signer-daemon. `HsmBackend` is a
# sync trait (the on-chain attestation flow is a low-frequency,
# blocking-friendly path), so we use `reqwest::blocking` here — same
# pattern as `chain-eth::erc20::RpcErc20LogClient`.
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true }
wiremock.workspace = true
serde_json.workspace = true
