[package]
name = "xindex-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xindex-shared.workspace = true
xindex-chain-eth.workspace = true
xindex-chain-evm.workspace = true
xindex-chain-utxo.workspace = true
xindex-chain-thor.workspace = true
xindex-multisig.workspace = true
xindex-safe-evm.workspace = true
alloy.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
bitcoin.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
sqlx.workspace = true
# RemoteMultisigCosigner posts PSBTs over HTTP to the signer-daemon.
# `MultisigCosigner` is a sync trait, so use `reqwest::blocking`
# — same pattern as `crates/signer`'s `RemoteHsmBackend`.
reqwest = { workspace = true, features = ["blocking"] }
base64 = "0.22"

[dev-dependencies]
wiremock.workspace = true
serde_json.workspace = true
# V7 tests: deterministic k1 signatures so the safe-evm aggregator's
# recovery cross-check passes against StubCosigner outputs.
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[[bin]]
name = "xindex-redeem"
path = "src/bin/xindex-redeem.rs"

[[bin]]
name = "xindex-redeem-evm"
path = "src/bin/xindex-redeem-evm.rs"
