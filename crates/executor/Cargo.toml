[package]
name = "xindex-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xindex-shared.workspace = true
xindex-chain-eth.workspace = true
xindex-chain-btc.workspace = true
xindex-chain-thor.workspace = true
xindex-multisig.workspace = true
alloy.workspace = true
