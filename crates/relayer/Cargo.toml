[package]
name = "xindex-relayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xindex-shared.workspace = true
xindex-chain-eth.workspace = true
xindex-chain-thor.workspace = true
xindex-ops.workspace = true
xindex-signer-daemon.workspace = true
alloy.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
futures-util.workspace = true
sqlx.workspace = true
prometheus.workspace = true
serde_json.workspace = true
serde.workspace = true
axum = { workspace = true, features = ["json"] }
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }

[[bin]]
name = "xindex-cancel"
path = "src/bin/xindex-cancel.rs"

[[bin]]
name = "xindex-finalize-redeem"
path = "src/bin/xindex-finalize-redeem.rs"

[[bin]]
name = "xindex-hint-builder"
path = "src/bin/xindex-hint-builder.rs"

[[bin]]
name = "xindex-price-collector"
path = "src/bin/xindex-price-collector.rs"

[[bin]]
name = "xindex-settlement-collector"
path = "src/bin/xindex-settlement-collector.rs"
