# cargo-deny configuration. Run `cargo deny check` locally before commit.

[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Surface unmaintained advisories across the WHOLE graph (incl. transitive),
# not just workspace-direct deps (audit 2026-06-01 L14). NOTE: cargo-deny 0.18
# removed the `vulnerability`/`unsound`/`notice` severity keys — every
# non-ignored advisory on deny's *feature-resolved* graph is already an error.
# deny is NOT a superset of `cargo audit`: a crate reachable only via a
# non-default feature (e.g. `lru`/`rsa`) is absent here but present in
# `cargo audit`'s full Cargo.lock scan, which is the authoritative gate.
unmaintained = "all"
ignore = [
    # `paste` is no longer maintained but is pulled in transitively via alloy
    # for compile-time macro expansion only. No runtime exposure; revisit when
    # alloy drops the dep.
    "RUSTSEC-2024-0436",
    # `derivative` unmaintained — pulled in transitively via alloy. Revisit
    # when alloy migrates to a maintained alternative.
    "RUSTSEC-2024-0388",
    # `lru` 0.12.5 has a Stacked Borrows violation in `IterMut`; alloy-rpc-client
    # uses `lru::LruCache` but does NOT call the affected `iter_mut`. No runtime
    # exposure for our usage; bump alloy when 0.12.6+ ships in their dep tree.
    "RUSTSEC-2026-0002",
    # `rsa` 0.9.x Marvin timing-sidechannel. Pulled transitively via
    # sqlx-mysql which sqlx 0.8 keeps in its lockfile entry even with
    # `default-features = false` + sqlite-only features. We do not
    # compile the mysql driver; the vulnerable code is not reachable.
    # No upstream fix available. Mirrored in justfile gate.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    # MIT + No False Attribs — used by `hex_lit` (transitive via bitcoin crate).
    # Adds an "advertising / endorsement" non-attribution clause on top of MIT.
    # Permissive in spirit; no copyleft surface.
    "MITNFA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# `workspace = true` path-deps register as wildcards in cargo-deny. Soften to
# warn so legitimate inter-crate deps don't fail the gate; revisit pre-mainnet.
wildcards = "warn"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
